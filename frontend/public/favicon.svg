<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Outer Cyber Shield Frame -->
  <path d="M32 6 L54 15 V30 C54 44.5 44 54 32 58 C20 54 10 44.5 10 30 V15 L32 6 Z" 
        fill="#0f0f14" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Inner Concentric Circuit Tech Lines -->
  <path d="M32 13 L47 19.5 V30 C47 40.5 39.5 47.5 32 50.5 C24.5 47.5 17 40.5 17 30 V19.5 L32 13 Z" 
        fill="none" stroke="#2c2c3b" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Center Sentinel Diamond / Core -->
  <path d="M32 20 L40 30 L32 40 L24 30 Z" fill="url(#shieldGrad)" opacity="0.2"/>
  
  <!-- Central Radar Core Eye -->
  <circle cx="32" cy="30" r="5" fill="url(#coreGrad)"/>
  <circle cx="32" cy="30" r="8" fill="none" stroke="url(#shieldGrad)" stroke-width="1.5"/>

  <!-- Scan Reticle Lines -->
  <line x1="32" y1="18" x2="32" y2="24" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="32" y2="42" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="30" x2="26" y2="30" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="30" x2="44" y2="30" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round"/>
</svg>